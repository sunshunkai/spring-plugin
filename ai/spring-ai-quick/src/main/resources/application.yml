# OpenAI兼容模式配置
spring:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}  # 从DeepSeek官网获取
      base-url: https://api.deepseek.com  # DeepSeek API地址
      chat:
        options:
          model: deepseek-chat  # 或deepseek-reasoner（推理模型）
          temperature: 0.7  # 控制输出随机性
          max-tokens: 1000  # 最大输出长度



logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
